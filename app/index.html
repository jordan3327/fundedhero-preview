<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Funded Hero Futures Dashboard</title>
    <link rel="icon" href="assets/images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/modern-login.css" />
  </head>
  <body>
    <div class="ml-root">
      <canvas id="ml-canvas" class="ml-canvas"></canvas>
      <div class="ml-vignette"></div>

      <div class="ml-card">
        <img class="ml-logo" src="assets/images/logo_auth.png" alt="FundedHero" />
        <h1 class="ml-title">Welcome back</h1>
        <p class="ml-sub">Sign in entering the information below</p>

        <form class="ml-form" id="login-form" novalidate>
          <div class="ml-field">
            <label class="ml-label" for="email">Email</label>
            <input class="ml-input" id="email" name="email" type="email" required />
          </div>

          <div class="ml-field">
            <label class="ml-label" for="password">Password</label>
            <input class="ml-input" id="password" name="password" type="password" required />
          </div>

          <div class="ml-remember">
            <label class="ml-check">
              <input type="checkbox" id="remember" />
              Remember me
            </label>
            <a class="ml-link" href="#" id="forgot-password">Forgot password</a>
          </div>

          <button type="submit" class="ml-submit">Login</button>
        </form>

        <div class="ml-switch">
          Don&rsquo;t have an account?
          <a href="#" id="create-account">Create one</a>
        </div>
        <div class="ml-footer">
          By logging in you accept the <a href="#">Terms &amp; Conditions</a>.
        </div>
      </div>
    </div>

    <script src="assets/js/modern-login.js" defer></script>
  </body>
</html>
